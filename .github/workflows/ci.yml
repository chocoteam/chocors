name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          native-image-job-reports: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set GRAALVM_HOME
        run: echo "GRAALVM_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      # Needed for native-image on Windows
      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Maven and LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y maven llvm-dev libclang-dev clang
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Install Maven and LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install maven llvm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Install Maven and LLVM (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install maven -y --no-progress
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
          # Chocolatey's Maven isn't on PATH until the next step
          echo "C:\\ProgramData\\chocolatey\\lib\\maven\\apache-maven-*\\bin" >> "$GITHUB_PATH"

      - name: Set RUST_BACKTRACE
        run: echo "RUST_BACKTRACE=1" >> "$GITHUB_ENV"

      - run: cargo xtask build-dll
      - run: cargo xtask generate-bindings
      - run: cargo xtask test-all
